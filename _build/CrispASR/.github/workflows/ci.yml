name: CI

on:
  push:
    branches: [main, master, integrated_cli]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Linux x86_64 (CPU)
  # ===========================================================================
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libopenblas-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_OPENBLAS=ON -DCRISPASR_BUILD_TESTS=OFF -DGGML_NATIVE=OFF

      - name: Build
        run: cmake --build build --target crispasr-cli crispasr-diff crispasr-quantize -j $(nproc)

      - name: Smoke test - help
        run: ./build/bin/crispasr --help

      - name: Smoke test - list backends
        run: ./build/bin/crispasr --list-backends

      # Guards the drift docs/contributing.md warns about: a backend reachable
      # from the CLI factory but missing from the c_api dispatch, the
      # available_backends list, or the generated feature matrix (and the
      # reverse — advertised by the C ABI but unreachable from the CLI). Exits 1
      # only on a REQUIRED gap; registry/test/README gaps stay advisory. Run on
      # Linux deliberately: the script's Go cgo-LDFLAGS drift check is unreliable
      # on macOS, where Metal/BLAS default on and pollute the linux link line.
      - name: Backend wiring audit
        run: python3 tools/check-backend-wiring.py --crispasr ./build/bin/crispasr

  # ===========================================================================
  # Linux x86_64 — AMR opencore FetchContent static build (opt-in gate guard)
  # ===========================================================================
  # The -DCRISPASR_AMR_FETCH=ON path compiles opencore-amr from source (for
  # platforms without a system libopencore-amr). It is OFF by default, so the
  # rest of the matrix never exercises it — and it silently broke once (§219):
  # an over-inclusive common/src glob pulled in files upstream excludes
  # (bits2prm.cpp → missing header), and an unanchored exclusion regex also
  # matched dtx_decoder_amr_wb.cpp (link error). Neither surfaced until the
  # static sources were actually compiled + linked + run. This job builds that
  # path and decodes samples/jfk.amr end-to-end so a regression fails CI at
  # authoring time. NOTE: the configure step asserts the gate genuinely turned
  # ON — otherwise the [amr] test WARN-skips and hides the regression (a false
  # green), which is precisely how the original break went unnoticed.
  linux-amr-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libopenblas-dev

      - name: Configure (AMR FetchContent static) + assert gate enabled
        run: |
          cmake -S . -B build-amr \
            -DCMAKE_BUILD_TYPE=Release -DGGML_OPENBLAS=ON -DGGML_NATIVE=OFF \
            -DCRISPASR_BUILD_TESTS=ON -DCRISPASR_AMR=ON -DCRISPASR_AMR_FETCH=ON \
            2>&1 | tee cfg.log
          grep -q "AMR via FetchContent" cfg.log || {
            echo "::error::CRISPASR_AMR_FETCH did not enable — the AMR static gate is not actually being tested (would give a false green)";
            exit 1;
          }

      - name: Build audio-format tests (compiles + links opencore-amr static)
        run: cmake --build build-amr --target test-audio-formats -j $(nproc)

      - name: Decode AMR end-to-end (samples/jfk.amr)
        run: ./build-amr/bin/test-audio-formats "[amr]"

  # ===========================================================================
  # Linux x86_64 — Opus FetchContent static build (opt-in gate guard)
  # ===========================================================================
  # Sibling of linux-amr-fetch: -DCRISPASR_OPUS_FETCH=ON statically builds
  # ogg + opus + opusfile (for platforms without a system opusfile). OFF by
  # default, so nothing else in the matrix compiles it — same rot risk as the
  # AMR path (opusfile is autotools-only, so its sources are hand-listed in
  # src/CMakeLists.txt: an upstream layout change or a missing symbol would
  # only surface here). This job builds it and decodes samples/jfk.webm
  # (Opus-in-WebM) through the static libs. Same false-green guard: the
  # configure step asserts the gate actually turned ON.
  linux-opus-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libopenblas-dev

      - name: Configure (Opus FetchContent static) + assert gate enabled
        run: |
          cmake -S . -B build-opus \
            -DCMAKE_BUILD_TYPE=Release -DGGML_OPENBLAS=ON -DGGML_NATIVE=OFF \
            -DCRISPASR_BUILD_TESTS=ON -DCRISPASR_OPUS=ON -DCRISPASR_OPUS_FETCH=ON \
            2>&1 | tee cfg.log
          grep -q "\.opus via FetchContent static" cfg.log || {
            echo "::error::CRISPASR_OPUS_FETCH did not enable — the Opus static gate is not actually being tested (would give a false green)";
            exit 1;
          }

      - name: Build audio-format tests (compiles + links opus/ogg/opusfile static)
        run: cmake --build build-opus --target test-audio-formats -j $(nproc)

      - name: Decode Opus-in-WebM end-to-end (samples/jfk.webm)
        run: ./build-opus/bin/test-audio-formats "[webm]"

  # ===========================================================================
  # Linux x86_64 — ASan/UBSan on the audio-format decoders (untrusted input)
  # ===========================================================================
  # crispasr_audio_load parses untrusted file bytes with hand-rolled decoders
  # (EBML/WebM demux, MP4 box parser, Sun-AU header). The default matrix builds
  # them only in Release, so a heap overflow / UB in that attack surface would
  # not surface. Build the audio-format tests with CRISPASR_SANITIZE_ADDRESS +
  # _UNDEFINED and decode the committed samples under the sanitizer. Also guards
  # the sanitizer build gate itself from rotting. (Scoped to the audio decoders
  # — the fuzzable surface — which keeps the job fast; broaden to the full unit
  # lane later if desired.)
  linux-asan-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libopenblas-dev libopusfile-dev

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=Debug
          -DGGML_NATIVE=OFF
          -DCRISPASR_BUILD_TESTS=ON
          -DCRISPASR_SANITIZE_ADDRESS=ON
          -DCRISPASR_SANITIZE_UNDEFINED=ON

      - name: Build audio-format tests under sanitizers
        run: cmake --build build-asan --target test-audio-formats -j $(nproc)

      - name: Decode samples under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build-asan/bin/test-audio-formats "[audio]"

  # ===========================================================================
  # Linux x86_64 — libFuzzer smoke run over crispasr_audio_load (untrusted input)
  # ===========================================================================
  # tests/fuzz/fuzz_audio_load.cpp fuzzes the one entry point that reaches every
  # hand-rolled audio parser (AU/AMR/WebM/MP4 + miniaudio). Build it with clang
  # (Linux clang ships the libFuzzer runtime; Apple Clang does not) and run a
  # short, seeded smoke pass under ASan/UBSan — a new crash fails CI. This is a
  # regression gate, not a fuzzing campaign; run it longer out of band for depth.
  linux-fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libopenblas-dev libopusfile-dev

      - name: Configure (fuzzer + ASan/UBSan, clang)
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DGGML_NATIVE=OFF
          -DCRISPASR_BUILD_TESTS=ON
          -DCRISPASR_FUZZ=ON
          -DCRISPASR_SANITIZE_ADDRESS=ON
          -DCRISPASR_SANITIZE_UNDEFINED=ON

      - name: Build the fuzz harness
        run: cmake --build build-fuzz --target crispasr-fuzz-audio -j $(nproc)

      - name: Smoke fuzz (seeded from samples/, ~45s; a crash fails CI)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          mkdir -p fuzz-corpus
          cp samples/jfk.wav samples/jfk.au samples/jfk.amr samples/jfk.webm \
             samples/jfk-vorbis.webm samples/jfk.m4a fuzz-corpus/ 2>/dev/null || true
          ./build-fuzz/bin/crispasr-fuzz-audio -max_total_time=45 -max_len=1048576 \
             -rss_limit_mb=4096 fuzz-corpus

  # ===========================================================================
  # Linux x86_64 + Vulkan
  # ===========================================================================
  linux-vulkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Vulkan SDK + glslc
        run: |
          # Install the Vulkan headers/loader + glslc shader compiler.
          # ubuntu-latest (24.04) ships libvulkan-dev but not glslc;
          # the glslc binary is in the `glslc` or `shaderc` package
          # depending on the distro version.
          sudo apt-get update
          sudo apt-get install -y cmake g++ libvulkan-dev spirv-headers glslc || \
          sudo apt-get install -y cmake g++ libvulkan-dev spirv-headers glslang-tools || \
          sudo apt-get install -y cmake g++ libvulkan-dev spirv-headers shaderc

      - name: Configure with Vulkan
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DCRISPASR_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --target crispasr-cli -j $(nproc)

      - name: Smoke test
        run: ./build/bin/crispasr --list-backends

  # ===========================================================================
  # macOS (Apple Silicon / x86_64)
  # ===========================================================================
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure with Metal
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=ON -DCRISPASR_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --target crispasr-cli -j $(sysctl -n hw.logicalcpu)

      - name: Smoke test
        run: ./build/bin/crispasr --list-backends

  # ===========================================================================
  # Windows (MSVC)
  # ===========================================================================
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # CRISPASR_BUILD_TESTS stays ON here (unlike the other smoke-only
      # platform jobs) so the speaker-db unit tests below actually run.
      # This is the only CI leg that exercises the .spkr v2 Windows write
      # path (CreateDirectoryA branch in src/speaker_db.cpp) and the
      # tests/test-speaker-db.cpp _WIN32 make_temp_dir() path.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCRISPASR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --target crispasr-cli -j $env:NUMBER_OF_PROCESSORS

      - name: Smoke test
        run: .\build\bin\Release\crispasr.exe --list-backends

      # Scoped, low-risk unit-test leg: build only the speaker-db-related
      # Catch2 targets (not the full, never-Windows-tested tests/ suite) and
      # filter ctest to just their test cases. test-params/test-speaker-db/
      # test-speaker-cluster are self-contained (Catch2 + crispasr-lib only,
      # test-params also links `common`); no POSIX-only helpers are compiled
      # into them. Untouched targets elsewhere in tests/CMakeLists.txt are
      # configured but never built, so their (OPTIONAL) ctest discovery
      # files are simply absent — ctest -R below only ever sees tests from
      # the three targets built here.
      - name: Build speaker-db unit tests
        run: cmake --build build --config Release --target test-speaker-db --target test-speaker-cluster --target test-params -j $env:NUMBER_OF_PROCESSORS

      - name: Run speaker-db unit tests
        run: ctest --test-dir build -C Release -R "speaker|cluster|centroid|whisper_params" -E "live|NOT_BUILT" --output-on-failure --timeout 120

  # ===========================================================================
  # iOS (cross-compile gate — no runtime test)
  # ===========================================================================
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure for iOS
        run: |
          cmake -S . -B build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DGGML_METAL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCRISPASR_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-ios --target crispasr-lib -j $(sysctl -n hw.logicalcpu)

  # ===========================================================================
  # Android (cross-compile gate — no runtime test)
  # ===========================================================================
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Configure for Android arm64
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DBUILD_SHARED_LIBS=OFF \
            -DCRISPASR_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-android --target crispasr-lib -j $(nproc)
